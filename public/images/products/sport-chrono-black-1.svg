<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f2eee7"/>
      <stop offset="100%" stop-color="#e8e2d8"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#14110e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#14110e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- grounding shadow so the object sits on the page -->
  <ellipse cx="400" cy="648" rx="190" ry="26" fill="url(#pool)"/>

  <g transform="translate(400,430) scale(13)" stroke="#14110e" stroke-opacity="0.5"
     stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M12 2 L12 4 M12 22 L12 20 M8 4 L16 4 L18 6 L18 18 L16 20 L8 20 L6 18 L6 6 Z M12 8 L12 13 L15 13 M9 6 L15 6 M9 18 L15 18"/>
  </g>

  <!-- colour chip: the real product colour, shown as a swatch -->
  <circle cx="400" cy="726" r="17" fill="#0a0a0a" stroke="none" stroke-width="1"/>

  <text x="400" y="800" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace"
        font-size="19" letter-spacing="4.2" fill="#14110e" fill-opacity="0.82">SPORT CHRONO</text>
  <text x="400" y="832" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace"
        font-size="14" letter-spacing="3.4" fill="#14110e" fill-opacity="0.45">BLACK</text>

  <line x1="345" y1="872" x2="455" y2="872" stroke="#e2dcd2" stroke-width="1"/>

  <text x="400" y="908" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace"
        font-size="11" letter-spacing="6" fill="#8a7b68">BRAND INDUSTRYS</text>
</svg>
